<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>Aeolian Guitar Tuner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Aeolian Tuner</h1>
    <span class="sub">Standard 6-string · E A D G B E</span>
  </header>

  <section class="display" aria-live="polite">
    <svg class="gauge" viewBox="0 0 300 170" aria-hidden="true">
      <g id="ticks"></g>
      <rect x="146" y="22" width="8" height="18" rx="2" class="center-mark"/>
      <g id="needle" transform="rotate(0 150 160)">
        <line x1="150" y1="160" x2="150" y2="34" />
        <circle cx="150" cy="160" r="7" />
      </g>
    </svg>
    <div class="note"><span id="note">–</span><sub id="octave"></sub></div>
    <div id="status" class="status">Tap Start, then pluck a string</div>
    <div class="readout"><span id="freq">— Hz</span> · <span id="cents">— ¢</span> · target <span id="target">—</span></div>
  </section>

  <section class="strings" id="strings" role="group" aria-label="Strings"></section>

  <section class="controls">
    <button id="start" class="primary">Start</button>
    <label class="toggle"><input type="checkbox" id="auto" checked> Auto-detect string</label>
    <div class="cal">
      <span>A4</span>
      <button id="calDown" aria-label="Lower A4">−</button>
      <output id="a4">440</output><span>Hz</span>
      <button id="calUp" aria-label="Raise A4">+</button>
    </div>
    <button id="tone">Play reference tone</button>
  </section>
  <p class="hint">Pluck one string at a time and let it ring. Use headphones or keep the reference tone off while tuning.</p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
